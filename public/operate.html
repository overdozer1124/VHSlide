<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学校の運用</title>
<style>
      :root {
        --bg: #f6f8f5;
        --card: #ffffff;
        --ink: #1f2a24;
        --muted: #56625b;
        --faint: #8b958f;
        --line: #d3dcd5;
        --line-soft: #e6ece7;
        --accent: #3c5a4c;
        --accent-dark: #2d4539;
        --accent-ink: #ffffff;
        --tint: #eaf0e9;
        --soft: #f3f6f2;
        --ok: #2f6a45;
        --ok-bg: #edf5ea;
        --err: #a8321f;
        --err-bg: #fbece8;
        --warn: #6e5410;
        --warn-bg: #f8f2df;
        --warn-line: #c9a540;
        --focus: #3c5a4c;
        --shadow: 0 1px 2px rgba(30, 50, 40, 0.05);
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
      body {
        margin: 0;
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
        background: var(--bg);
        color: var(--ink);
        font-size: 16px;
        line-height: 1.7;
      }
      :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      h1, h2, h3 { line-height: 1.35; }
      h2 { font-size: 1.25rem; margin: 0; }
      h3 { font-size: 1.05rem; margin: 0; }
      p { margin: 0.35rem 0; }
      .muted { color: var(--muted); }
      .small { font-size: 0.9rem; }

      /* ---------- top bar ---------- */
      .topbar {
        position: sticky; top: 0; z-index: 20;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      .topbar-inner {
        max-width: 60rem; margin: 0 auto;
        padding: 0.6rem 1rem;
        display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
      }
      .back-link {
        color: var(--accent-dark); text-decoration: none; font-size: 0.92rem;
        border: 1px solid var(--line); border-radius: 999px;
        padding: 0.3rem 0.8rem; background: var(--card); white-space: nowrap;
      }
      .back-link:hover { background: var(--tint); }
      .brand { font-weight: bold; font-size: 1.1rem; margin-right: auto; }
      .brand small { font-weight: normal; color: var(--muted); font-size: 0.82rem; margin-left: 0.5rem; }
      .me { display: flex; align-items: center; gap: 0.5rem; font-size: 0.92rem; }
      .avatar {
        width: 2rem; height: 2rem; border-radius: 50%;
        background: var(--tint); color: var(--accent-dark);
        display: inline-flex; align-items: center; justify-content: center;
        font-weight: bold; font-size: 0.85rem; flex: 0 0 auto;
      }

      main { max-width: 60rem; margin: 0 auto; padding: 1rem 1rem 5rem; }

      /* ---------- mock banner ---------- */
      .mock-banner {
        display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;
        background: var(--warn-bg); color: var(--warn);
        border: 1px dashed var(--warn-line);
        border-radius: 10px; padding: 0.55rem 0.9rem; margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      .mock-banner .grow { flex: 1 1 18rem; }
      .mock-banner select { font: inherit; font-size: 0.88rem; padding: 0.25rem 0.5rem; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }

      .intro h1 { font-size: 1.5rem; margin: 0.2rem 0 0.2rem; }
      .intro p { color: var(--muted); max-width: 44rem; }

      /* ---------- section nav ---------- */
      .jump {
        display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0 0.4rem;
      }
      .jump a {
        text-decoration: none; color: var(--accent-dark);
        background: var(--card); border: 1px solid var(--line);
        border-radius: 999px; padding: 0.3rem 0.9rem; font-size: 0.9rem;
        display: inline-flex; align-items: center; gap: 0.4rem;
      }
      .jump a:hover { background: var(--tint); }

      /* ---------- cards ---------- */
      .card {
        background: var(--card); border: 1px solid var(--line);
        border-radius: 14px; padding: 1.2rem 1.3rem; margin: 1rem 0;
        box-shadow: var(--shadow);
      }
      .card-head { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
      .card-head .grow { flex: 1 1 auto; }
      .lead { color: var(--muted); margin: 0.4rem 0 0.2rem; }
      .section-label {
        font-size: 0.8rem; font-weight: bold; letter-spacing: 0.06em;
        color: var(--muted); margin: 1.8rem 0 -0.3rem 0.2rem;
      }

      /* ---------- chips / badges ---------- */
      .chip {
        display: inline-flex; align-items: center; gap: 0.3rem;
        font-size: 0.78rem; border-radius: 999px; padding: 0.05rem 0.6rem;
        background: var(--soft); color: var(--muted); border: 1px solid var(--line-soft);
        white-space: nowrap; line-height: 1.6;
      }
      .chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
      .chip.off { background: var(--soft); color: var(--faint); }
      .chip.accent { background: var(--tint); color: var(--accent-dark); border-color: transparent; }
      .chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
      .chip .dot { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: currentColor; }
      .count {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 1.35rem; height: 1.35rem; padding: 0 0.35rem;
        border-radius: 999px; font-size: 0.75rem; font-weight: bold;
        background: var(--soft); color: var(--muted);
      }
      .count.hot { background: var(--warn-line); color: #2b2000; }

      /* ---------- help (collapsible steps) ---------- */
      details.help { margin: 0.5rem 0 0.2rem; }
      details.help summary {
        cursor: pointer; color: var(--accent-dark); font-size: 0.9rem;
        list-style: none; display: inline-flex; align-items: center; gap: 0.35rem;
      }
      details.help summary::-webkit-details-marker { display: none; }
      details.help summary::before {
        content: "?"; display: inline-flex; align-items: center; justify-content: center;
        width: 1.2rem; height: 1.2rem; border-radius: 50%;
        border: 1.5px solid currentColor; font-size: 0.75rem; font-weight: bold;
      }
      details.help[open] summary { margin-bottom: 0.3rem; }
      details.help ol {
        margin: 0; padding: 0.6rem 0.9rem 0.6rem 2.2rem;
        background: var(--soft); border-radius: 10px; font-size: 0.93rem;
      }
      details.help li { margin: 0.15rem 0; }

      /* ---------- forms ---------- */
      .form-row { display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: flex-end; margin: 0.8rem 0 0.2rem; }
      .field { display: flex; flex-direction: column; gap: 0.25rem; flex: 1 1 14rem; min-width: 0; }
      .field.narrow { flex: 0 1 auto; }
      .field-label { font-weight: bold; font-size: 0.9rem; }
      .field-note { font-size: 0.82rem; color: var(--muted); }
      input[type="text"], input[type="email"] {
        width: 100%; font: inherit; padding: 0.55rem 0.75rem; min-height: 44px;
        border: 1px solid var(--line); border-radius: 8px;
        background: var(--card); color: var(--ink);
      }
      input[aria-invalid="true"] { border-color: var(--err); background: var(--err-bg); }
      .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-height: 44px; }
      .segmented label { display: flex; align-items: center; cursor: pointer; }
      .segmented input { position: absolute; opacity: 0; pointer-events: none; }
      .segmented span { padding: 0.5rem 1.1rem; color: var(--muted); }
      .segmented label + label span { border-left: 1px solid var(--line); }
      .segmented input:checked + span { background: var(--accent); color: var(--accent-ink); font-weight: bold; }
      .segmented input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: -3px; }

      /* ---------- buttons ---------- */
      .btn {
        font: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
        padding: 0.5rem 1.1rem; min-height: 44px; border-radius: 9px;
        border: 1px solid var(--line); background: var(--card); color: var(--ink);
        cursor: pointer; white-space: nowrap;
      }
      .btn:hover { background: var(--soft); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: bold; }
      .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
      .btn.danger { color: var(--err); border-color: var(--line); }
      .btn.danger:hover { background: var(--err-bg); }
      .btn.danger.solid { background: var(--err); border-color: var(--err); color: #fff; font-weight: bold; }
      .btn.ghost { border-color: transparent; background: transparent; color: var(--accent-dark); }
      .btn.ghost:hover { background: var(--tint); }
      .btn.sm { padding: 0.25rem 0.75rem; min-height: 36px; font-size: 0.88rem; }
      .btn:disabled, .btn:disabled:hover { opacity: 0.45; cursor: not-allowed; background: var(--card); }
      .btn.primary:disabled, .btn.primary:disabled:hover { background: var(--accent); border-color: var(--accent); }
      .btn.danger.solid:disabled, .btn.danger.solid:disabled:hover { background: var(--err); }

      /* ---------- inline result ---------- */
      .result { display: none; border-radius: 10px; padding: 0.55rem 0.9rem; margin-top: 0.7rem; font-size: 0.93rem; }
      .result.show { display: block; }
      .result.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid #cfe0c9; }
      .result.err { background: var(--err-bg); color: var(--err); }

      /* ---------- tabs ---------- */
      .tabs { display: flex; gap: 0.2rem; border-bottom: 1px solid var(--line); margin: 1rem 0 0.2rem; overflow-x: auto; }
      .tab {
        font: inherit; background: none; border: none; cursor: pointer;
        padding: 0.55rem 0.9rem; color: var(--muted); white-space: nowrap;
        border-bottom: 3px solid transparent; margin-bottom: -1px;
        display: inline-flex; align-items: center; gap: 0.4rem; min-height: 44px;
      }
      .tab:hover { color: var(--ink); }
      .tab[aria-selected="true"] { color: var(--accent-dark); border-bottom-color: var(--accent); font-weight: bold; }
      .tab-panel { padding-top: 0.6rem; }

      /* ---------- lists ---------- */
      .list { margin: 0.8rem 0 0; border: 1px solid var(--line-soft); border-radius: 10px; overflow: hidden; }
      .list-head {
        display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
        padding: 0.45rem 0.9rem; background: var(--soft); font-size: 0.85rem; color: var(--muted);
      }
      .list-head .grow { flex: 1 1 auto; }
      .list-head label { display: inline-flex; align-items: center; gap: 0.3rem; cursor: pointer; }
      .row {
        display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap;
        padding: 0.6rem 0.9rem; border-top: 1px solid var(--line-soft);
      }
      .row.dim .who-main, .row.dim .who-sub { color: var(--faint); }
      .row.dim .who-main { text-decoration: line-through; }
      .who { display: flex; align-items: center; gap: 0.6rem; flex: 1 1 16rem; min-width: 0; }
      .who-text { min-width: 0; }
      .who-main { font-weight: bold; overflow-wrap: anywhere; }
      .who-sub { font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }
      .badges { display: flex; gap: 0.35rem; flex-wrap: wrap; }
      .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-left: auto; align-items: center; }
      .confirm-text { font-size: 0.85rem; color: var(--err); font-weight: bold; }
      .empty {
        text-align: center; color: var(--muted); padding: 1.3rem 1rem; font-size: 0.93rem;
        border-top: 1px solid var(--line-soft);
      }

      /* ---------- callouts ---------- */
      .callout { border-radius: 10px; padding: 0.65rem 0.9rem; margin: 0.7rem 0; font-size: 0.93rem; display: flex; gap: 0.6rem; align-items: flex-start; }
      .callout.warn { background: var(--warn-bg); color: var(--warn); }
      .callout.info { background: var(--tint); color: var(--accent-dark); }
      .callout .grow { flex: 1 1 auto; }
      .timer { font-variant-numeric: tabular-nums; font-weight: bold; font-size: 1.05rem; white-space: nowrap; }

      /* ---------- operator task picker ---------- */
      .task-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin: 0.5rem 0 0.2rem; }
      @media (max-width: 640px) { .task-grid { grid-template-columns: 1fr; } }
      .task-card {
        border: 2px solid var(--line); border-radius: 12px; padding: 0.75rem 0.9rem;
        cursor: pointer; display: block; position: relative; background: var(--card);
      }
      .task-card:hover { border-color: var(--accent); }
      .task-card input { position: absolute; opacity: 0; pointer-events: none; }
      .task-card:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
      .task-name { font-weight: bold; display: block; }
      .task-desc { font-size: 0.88rem; color: var(--muted); }
      .task-card.selected { border-color: var(--accent); background: var(--tint); }
      .task-card.selected .task-name::after { content: " ✓"; color: var(--accent-dark); }
      fieldset.plain { border: none; padding: 0; margin: 1rem 0 0; }
      fieldset.plain legend { font-weight: bold; padding: 0; }
      fieldset.plain:disabled .task-card { opacity: 0.55; cursor: not-allowed; }

      /* ---------- stepper ---------- */
      .stepper { list-style: none; margin: 0.8rem 0; padding: 0; position: relative; }
      .stepper li {
        display: grid; grid-template-columns: 2.2rem 1fr auto; gap: 0.2rem 0.8rem; align-items: center;
        padding: 0.7rem 0.8rem; border-radius: 12px; margin: 0.35rem 0;
        border: 1px solid var(--line-soft); background: var(--card);
      }
      .stepper li.current { border: 2px solid var(--accent); background: var(--tint); }
      .stepper li.done { background: var(--ok-bg); border-color: transparent; }
      .step-num {
        width: 2.2rem; height: 2.2rem; border-radius: 50%;
        background: var(--soft); color: var(--muted); border: 1px solid var(--line);
        display: flex; align-items: center; justify-content: center; font-weight: bold;
      }
      li.current .step-num { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      li.done .step-num { background: var(--ok); color: #fff; border-color: var(--ok); }
      .step-title { font-weight: bold; }
      .step-desc { font-size: 0.88rem; color: var(--muted); }
      .step-signin { grid-column: 2 / -1; margin-top: 0.4rem; }
      .step-redo { font-size: 0.85rem; }

      .submit-bar {
        display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
        border-top: 1px solid var(--line-soft); padding-top: 0.9rem; margin-top: 0.6rem;
      }
      .submit-bar .hint { flex: 1 1 14rem; font-size: 0.92rem; color: var(--muted); }
      .submit-bar .hint.ready { color: var(--ok); font-weight: bold; }

      .mock-google-btn {
        display: inline-flex; align-items: center; gap: 10px;
        background: #fff; border: 1px solid #dadce0; border-radius: 6px;
        padding: 8px 16px; font: inherit; font-size: 15px; color: #3c4043;
        cursor: pointer; min-height: 44px;
      }
      .mock-google-btn:hover { background: #f8f9fa; }
      .mock-google-btn:disabled { opacity: 0.5; cursor: not-allowed; }

      /* ---------- sign-in / states ---------- */
      .center { text-align: center; }
      .signin-card { max-width: 28rem; margin: 3rem auto; text-align: center; padding: 2rem 1.5rem; }
      .loading { text-align: center; color: var(--muted); padding: 3rem 0; }
      #status:empty { display: none; }
      #status { color: var(--err); background: var(--err-bg); border-radius: 10px; padding: 0.6rem 0.9rem; font-weight: bold; }

      /* ---------- toast ---------- */
      .toast-wrap { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 0.4rem; align-items: center; width: min(92vw, 30rem); pointer-events: none; }
      .toast {
        background: var(--ink); color: var(--bg); border-radius: 10px;
        padding: 0.65rem 1rem; font-size: 0.93rem; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        animation: toast-in 0.18s ease-out; pointer-events: auto;
      }
      .toast.err { background: var(--err); color: #fff; }
      @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .toast { animation: none; } html { scroll-behavior: auto; } }

      @media (max-width: 640px) {
        .card { padding: 1rem; border-radius: 12px; }
        .actions { margin-left: 0; width: 100%; }
        .brand small { display: none; }
        .stepper li { grid-template-columns: 2.2rem 1fr; }
        .stepper li > .chip { grid-column: 2; justify-self: start; }
      }
    
      /* ---------- operate v2 additions ---------- */
      select {
        width: 100%; font: inherit; padding: 0.55rem 0.75rem; min-height: 44px;
        border: 1px solid var(--line); border-radius: 8px;
        background: var(--card); color: var(--ink);
      }
      .dock {
        border: 2px solid var(--accent); background: var(--tint);
        border-radius: 12px; padding: 0.9rem 1rem; margin: 0.9rem 0;
      }
      .dock.waiting { border-color: var(--line); background: var(--soft); }
      .dock-head { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
      .dock-head .grow { flex: 1 1 auto; }
      .gsi-host { min-height: 44px; display: flex; align-items: center; margin-top: 0.5rem; }
      .school-pick { max-width: 26rem; }
      .divider { border-top: 1px solid var(--line-soft); margin: 1.1rem 0 0.4rem; }
</style>
</head>
<body data-page="stage1-operate">
<header class="topbar"><div class="topbar-inner">
  <a class="back-link" href="/">← 作品の画面に戻る</a>
  <div class="brand">学校の運用<small>VHSlide</small></div>
  <div class="me" id="me"></div>
</div></header>
<main>
  <div id="status" role="alert"></div>
  <div id="app"><p class="loading">読み込んでいます…</p></div>
</main>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<script>
"use strict";
/* 学校の運用ページ（招待制・運営者欄つき）
   画面の作りだけを扱い、経路と送る内容はサーバーの契約どおりに固定する。 */

function h(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of children.flat(9)) {
    if (c == null) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}

async function send(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: opts.body ? { "Content-Type": "application/json" } : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch { /* 応答が空のことがある */ }
  if (!res.ok) throw new Error((data && data.error) || `通信に失敗しました（${res.status}）`);
  return data;
}

function toast(msg, isErr) {
  const wrap = document.getElementById("toasts");
  const t = h("div", { class: "toast" + (isErr ? " err" : ""), role: "status" }, msg);
  wrap.append(t);
  setTimeout(() => t.remove(), 4200);
}

function makeResult() {
  const el = h("div", { class: "result", role: "status" });
  return {
    el,
    show(msg, ok) {
      el.textContent = (ok ? "✓ " : "！ ") + msg;
      el.className = "result show " + (ok ? "ok" : "err");
    },
    clear() { el.className = "result"; el.textContent = ""; },
  };
}

/* 取り消しのきく、その場の確認（押す→確認文と実行ボタンに変わる） */
function confirmInline(actionsEl, text, confirmLabel, onConfirm) {
  const original = [...actionsEl.childNodes];
  actionsEl.replaceChildren(
    h("span", { class: "confirm-text" }, text),
    h("button", {
      class: "btn sm danger solid", type: "button",
      onclick: () => { restore(); onConfirm(); },
    }, confirmLabel),
    h("button", {
      class: "btn sm ghost", type: "button",
      onclick: () => restore(),
    }, "やめる"),
  );
  function restore() { actionsEl.replaceChildren(...original); }
}

function fmtDate(ms) {
  return new Date(ms).toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" });
}

/* ---------- Google サインイン ---------- */
let gsiScriptPromise = null;
function ensureGsiScript() {
  if (!gsiScriptPromise) {
    gsiScriptPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://accounts.google.com/gsi/client";
      s.onload = resolve; s.onerror = reject;
      document.head.append(s);
    });
  }
  return gsiScriptPromise;
}
async function initGsi(clientId, nonce, onCredential) {
  await ensureGsiScript();
  const opts = { client_id: clientId, callback: (resp) => onCredential(resp.credential) };
  if (nonce) opts.nonce = nonce;
  google.accounts.id.initialize(opts);
}
function renderGsiButton(host) {
  host.replaceChildren();
  google.accounts.id.renderButton(host, { theme: "outline", size: "large", text: "signin_with", locale: "ja" });
}

/* ---------- 起動 ---------- */
let clientId = null;

async function boot() {
  const status = document.getElementById("status");
  try {
    const cfg = await send("/api/config");
    clientId = cfg.clientId;
    const session = await send("/api/session");
    if (!session.user) { drawSignIn(); return; }
    drawAccount(session.user);
    const view = await send("/api/stage1/console");
    draw(view);
  } catch (e) {
    status.textContent = e.message;
    document.getElementById("app").replaceChildren();
  }
}

function drawAccount(user) {
  const me = document.getElementById("me");
  me.replaceChildren(
    h("span", { class: "avatar", "aria-hidden": "true" }, (user.name || "?").slice(0, 1)),
    h("span", null, user.name),
    h("button", {

/* ---------- 本体 ---------- */
function draw(view) {
  const app = document.getElementById("app");
  const parts = [];
  parts.push(h("div", { class: "intro" },
    h("h1", null, "学校の運用"),
    h("p", null, "学校の作成、事前登録、所属の管理、学校管理者の申請、運営者の招待と失効を行うページです。あなたの役割に合った欄だけが表示されています。"),
  ));
  parts.push(rolesCard());
  if (view.myInvitation) parts.push(invitationCard(view.myInvitation));
  if (view.createSchool) parts.push(createSchoolCard());
  if (view.schools.length) parts.push(schoolsCard(view));
  const apply = applyCard(view);
  if (apply) parts.push(apply);
  if (view.operator) parts.push(operatorCard(view));
  const hasApplyTargets = view.applyTo.some((s) => !view.schools.some((m) => m.id === s.id));
  if (!view.myInvitation && !view.createSchool && !view.schools.length && !view.operator && !hasApplyTargets) {
    parts.push(h("section", { class: "card" },
      h("h2", null, "この操作は利用できません"),
      h("p", { class: "lead" }, "いまのサインインには、ここで使う役割がありません。学校の管理者になりたいときは、スーパー管理者に申請の受付を相談してください。運営者への招待が届いている場合は、このページに承諾の欄が表示されます。"),
    ));
  }
  app.replaceChildren(...parts);
}

/* ---------- 学校（1つの枠＋学校切り替え） ---------- */
const ROLE_LABEL = { teacher: "教師", student: "生徒" };
const roleLabel = (r) => ROLE_LABEL[r] || r || "";

function schoolsCard(view) {
  const panel = h("div", null);
  const state = { schoolId: view.schools[0].id, tab: null, data: null };
  const result = makeResult();

  const card = h("section", { class: "card", id: "schools" },
    h("div", { class: "card-head" },
      h("h2", null, "学校"),
      h("span", { class: "chip" }, `${view.schools.length} 校`),
    ),
    h("p", { class: "lead" }, "学校を選ぶと、その学校の事前登録・所属している人・管理者の申請が切り替わります。"),
  );
  if (view.schools.length > 1) {
    const select = h("select", {
      class: "school-pick", "aria-label": "表示する学校",
      onchange: () => { state.schoolId = select.value; state.tab = null; load(); },
    }, ...view.schools.map((s) => h("option", { value: s.id }, s.name)));
    card.append(h("div", { class: "form-row" },
      h("label", { class: "field" },
        h("span", { class: "field-label" }, "表示する学校"),
        select,
      ),
    ));
  } else {
    card.append(h("h3", null, view.schools[0].name));
  }
  card.append(panel, result.el);

  async function load() {
    panel.replaceChildren(h("p", { class: "loading" }, "読み込んでいます…"));
    const id = state.schoolId;
    try {
      const [preregs, members, applications] = await Promise.all([
        send(`/api/organizations/${id}/preregistrations`),
        send(`/api/organizations/${id}/members`),
        view.decideApplications
          ? send(`/api/organizations/${id}/school-admin-applications`)
          : Promise.resolve({ applications: [] }),
      ]);
      state.data = {
        preregs: preregs.preregistrations,
        members: members.members,
        applications: applications.applications,
      };
      if (!state.tab) {
        const pending = state.data.applications.filter((a) => a.status === "申請中").length;
        state.tab = view.decideApplications && pending > 0 ? "applications" : "prereg";
      }
      renderPanel();
    } catch (e) { result.show(e.message, false); panel.replaceChildren(); }
  }

  function renderPanel() {
    const d = state.data;
    const pending = d.applications.filter((a) => a.status === "申請中").length;
    const tabsDef = [
      { key: "prereg", label: "事前登録", count: d.preregs.filter((p) => p.status === "有効").length },
      { key: "members", label: "所属している人", count: d.members.filter((m) => m.status === "有効").length },
    ];
    if (view.decideApplications) tabsDef.push({ key: "applications", label: "管理者の申請", count: pending });
    const tabs = h("div", { class: "tabs", role: "tablist" },
      ...tabsDef.map((t) => h("button", {
        class: "tab", type: "button", role: "tab",
        "aria-selected": state.tab === t.key ? "true" : "false",
        onclick: () => { state.tab = t.key; renderPanel(); },
      }, t.label, h("span", { class: "count" }, String(t.count)))),
    );
    const body = h("div", { class: "tab-panel" });
    if (state.tab === "prereg") body.append(preregPanel());
    else if (state.tab === "members") body.append(membersPanel());
    else body.append(applicationsPanel());
    panel.replaceChildren(tabs, body);
  }

  async function refresh(keepTab = true) {
    if (!keepTab) state.tab = null;
    await load();
  }

  function preregPanel() {
    const wrap = h("div", null);
    const local = makeResult();
    const email = h("input", { type: "email", placeholder: "例：taro@example.jp", "aria-label": "メールアドレス" });
    let plannedRole = "teacher";
    const seg = h("div", { class: "segmented", role: "radiogroup", "aria-label": "役割" },
      ...["teacher", "student"].map((r) => h("label", null,
        h("input", { type: "radio", name: `role-${state.schoolId}`, ...(r === "teacher" ? { checked: true } : {}),
          onchange: () => { plannedRole = r; } }),
        h("span", null, ROLE_LABEL[r]),
      )),
    );
    const addBtn = h("button", { class: "btn primary", type: "submit" }, "事前登録を作る");
    wrap.append(
      h("p", { class: "small muted" }, "メールアドレスを事前に登録しておくと、その人がサインインしたときに自動でこの学校の所属になります。"),
      h("form", {
        onsubmit: async (ev) => {
          ev.preventDefault();
          const value = email.value.trim();
          if (!value) { local.show("メールアドレスを入れてください。", false); email.focus(); return; }
          addBtn.disabled = true;
          try {
            await send(`/api/organizations/${state.schoolId}/preregistrations`, {
              method: "POST", body: { email: value, plannedRole },
            });
            local.show(`${value} を事前登録しました。`, true);
            email.value = "";
            await refresh();
          } catch (e) { local.show(e.message, false); }
          addBtn.disabled = false;
        },
      }, h("div", { class: "form-row" },
        h("label", { class: "field" }, h("span", { class: "field-label" }, "メールアドレス"), email),
        h("div", { class: "field narrow" }, h("span", { class: "field-label" }, "役割"), seg),
        addBtn,
      )),
      local.el,
    );
    const rows = state.data.preregs;
    if (!rows.length) { wrap.append(h("div", { class: "empty" }, "事前登録はまだありません。")); return wrap; }
    const list = h("div", { class: "list" });
    for (const p of rows) {
      const actions = h("div", { class: "actions" });
      if (p.status === "有効") {
        actions.append(h("button", {
          class: "btn sm danger", type: "button",
          onclick: () => confirmInline(actions, "この事前登録を取り消しますか？", "取り消す", async () => {
            try {
              await send(`/api/preregistrations/${p.id}`, { method: "DELETE" });
              result.show("事前登録を取り消しました。", true);
              await refresh();
            } catch (e) { result.show(e.message, false); }
          }),
        }, "取り消す"));
      }
      list.append(h("div", { class: "row" + (p.status !== "有効" ? " dim" : "") },
        h("div", { class: "who" }, h("div", { class: "who-text" },
          h("div", { class: "who-main" }, p.email),
          h("div", { class: "who-sub" }, roleLabel(p.plannedRole)),
        )),
        h("span", { class: "badges" },
          p.status === "有効" ? h("span", { class: "chip ok" }, "有効") : h("span", { class: "chip off" }, p.status),
        ),
        actions,
      ));
    }
    wrap.append(list);
    return wrap;
  }

  function membersPanel() {
    const wrap = h("div", null);
    const rows = state.data.members;
    if (!rows.length) { wrap.append(h("div", { class: "empty" }, "所属している人はまだいません。")); return wrap; }
    const list = h("div", { class: "list" });
    for (const m of rows) {
      const actions = h("div", { class: "actions" });
      if (m.status === "有効") {
        actions.append(h("button", {
          class: "btn sm danger", type: "button",
          onclick: () => confirmInline(actions, "この所属を無効にしますか？", "無効にする", async () => {
            try {
              await send(`/api/organizations/${state.schoolId}/members/${m.id}/invalidate`, { method: "POST", body: {} });
              result.show(`${m.name} さんの所属を無効にしました。`, true);
              await refresh();
            } catch (e) { result.show(e.message, false); }
          }),
        }, "無効にする"));
      } else {
        actions.append(h("button", {
          class: "btn sm", type: "button",
          onclick: async () => {
            try {
              await send(`/api/organizations/${state.schoolId}/members/${m.id}/reactivate`, { method: "POST", body: { role: m.role } });
              result.show(`${m.name} さんの所属を有効に戻しました。`, true);
              await refresh();
            } catch (e) { result.show(e.message, false); }
          },
        }, "有効に戻す"));
      }
      if (view.revokeSchoolAdmin && m.schoolAdmin && m.status === "有効") {
        actions.append(h("button", {
          class: "btn sm danger", type: "button",
          onclick: () => confirmInline(actions, "学校管理者を解除しますか？", "解除する", async () => {
            try {
              await send(`/api/organizations/${state.schoolId}/school-admins/${m.id}`, { method: "DELETE" });
              result.show(`${m.name} さんの学校管理者を解除しました。`, true);
              await refresh();
            } catch (e) { result.show(e.message, false); }
          }),
        }, "管理者を解除する"));
      }
      list.append(h("div", { class: "row" + (m.status !== "有効" ? " dim" : "") },
        h("div", { class: "who" }, h("div", { class: "who-text" },
          h("div", { class: "who-main" }, m.name),
          h("div", { class: "who-sub" }, m.email),
        )),
        h("span", { class: "badges" },
          m.status === "有効" ? h("span", { class: "chip ok" }, "有効") : h("span", { class: "chip off" }, "無効"),
          m.schoolAdmin ? h("span", { class: "chip accent" }, "学校管理者") : null,
          m.role ? h("span", { class: "chip" }, roleLabel(m.role)) : null,
        ),
        actions,
      ));
    }
    wrap.append(
      h("p", { class: "small muted" }, "所属を無効にすると、その人はこの学校の作品に入れなくなります。元に戻すこともできます。"),
      list,
    );
    return wrap;
  }

  function applicationsPanel() {
    const wrap = h("div", null);
    const rows = state.data.applications;
    if (!rows.length) { wrap.append(h("div", { class: "empty" }, "申請はまだありません。")); return wrap; }
    const list = h("div", { class: "list" });
    for (const a of rows) {
      const actions = h("div", { class: "actions" });
      if (a.status === "申請中") {
        actions.append(
          h("button", {
            class: "btn sm primary", type: "button",
            onclick: async () => {
              try {
                await send(`/api/school-admin-applications/${a.id}/decide`, { method: "POST", body: { decision: "登録" } });
                result.show(`${a.applicant.name} さんを学校管理者に登録しました。`, true);
                await refresh();
              } catch (e) { result.show(e.message, false); }
            },
          }, "登録する"),
          h("button", {
            class: "btn sm danger", type: "button",
            onclick: () => confirmInline(actions, "この申請を却下しますか？", "却下する", async () => {
              try {
                await send(`/api/school-admin-applications/${a.id}/decide`, { method: "POST", body: { decision: "却下" } });
                result.show("申請を却下しました。", true);
                await refresh();
              } catch (e) { result.show(e.message, false); }
            }),
          }, "却下する"),
        );
      }
      list.append(h("div", { class: "row" },
        h("div", { class: "who" }, h("div", { class: "who-text" },
          h("div", { class: "who-main" }, a.applicant.name),
          h("div", { class: "who-sub" }, a.applicant.email),
        )),
        h("span", { class: "badges" },
          a.status === "申請中" ? h("span", { class: "chip warn" }, "申請中")
            : a.status === "登録" ? h("span", { class: "chip ok" }, "登録済み")
            : h("span", { class: "chip off" }, a.status),
        ),
        actions,
      ));
    }
    wrap.append(
      h("p", { class: "small muted" }, "学校管理者への申請です。「登録する」を押すと、その人がこの学校の管理者になります。"),
      list,
    );
    return wrap;
  }

  load();
  return card;
}

/* ---------- 運営者（招待と失効） ---------- */
function operatorCard(view) {
  const result = makeResult();
  const op = {
    credential: null, busy: false, timer: null, armSeq: 0,
    expiresAt: 0, generation: view.operatorGeneration,
  };

  const stateChip = h("span", { class: "chip" }, "未確認");
  const dockText = h("p", { class: "small", style: "margin:0.3rem 0 0" },
    "まず本人確認をしてください。確認すると、下の操作を1つだけ実行できます。");
  const gsiHost = h("div", { class: "gsi-host" });
  const dock = h("div", { class: "dock waiting" },
    h("div", { class: "dock-head" },
      h("strong", null, "本人確認（運営者本人）"),
      h("span", { class: "grow" }),
      stateChip,
    ),
    h("p", { class: "small muted", style: "margin:0.3rem 0 0" },
      "招待を作る・取り消す、運営者を失効させる操作には、その都度、あなた自身の Google サインインが必要です。確認は5分間・1つの操作だけに使えます。相手の同席やサインインは要りません。"),
    gsiHost,
    dockText,
  );

  const genLine = h("p", { class: "small muted" }, "");
  const opsWrap = h("div", null);
  const invitesWrap = h("div", null);

  const emailInput = h("input", { type: "email", placeholder: "例：taro@example.jp", "aria-label": "招待するメールアドレス" });
  const inviteBtn = h("button", { class: "btn primary op-action", type: "submit" }, "招待を作る");
  const inviteForm = h("form", {
    onsubmit: (ev) => {
      ev.preventDefault();
      const email = emailInput.value.trim();
      if (!email) { result.show("メールアドレスを入れてください。", false); emailInput.focus(); return; }
      runAction(
        (cred) => send("/api/stage1/operators/invitations", { method: "POST", body: { credential: cred, email } }),
        () => { emailInput.value = ""; return `${email} への招待を作りました。相手がサインインして承諾すると、運営者になります。`; },
      );
    },
  }, h("div", { class: "form-row" },
    h("label", { class: "field" }, h("span", { class: "field-label" }, "招待するメールアドレス"), emailInput),
    inviteBtn,
  ));

  const card = h("section", { class: "card", id: "operator" },
    h("div", { class: "card-head" },
      h("h2", null, "運営者"),
      h("span", { class: "chip accent" }, "運営者だけ"),
    ),
    h("p", { class: "lead" }, "運営者の追加は招待で、失効はこの一覧から行います。Google の識別子は画面に表示されません。"),
    h("div", { class: "callout info" }, h("span", { class: "grow" },
      "運営者は、スーパー管理者を立てるときだけ使う非常用の役割です。学校を作ったり、学校の所属を変えたりすることはできません。スーパー管理者のアカウントが使えなくなったときに、別の人をスーパー管理者に立て直すためにあります。ふだんは使うことのない欄です。")),
    dock,
    h("div", { class: "divider" }),
    h("h3", null, "運営者の一覧"),
    genLine,
    opsWrap,
    h("div", { class: "divider" }),
    h("h3", null, "運営者を招待する"),
    h("p", { class: "small muted" }, "招待の期限は7日です。相手が自分の端末でサインインし、このページで承諾すると運営者になります。異動の引き継ぎも、相手の同席なしで進められます。スーパー管理者とは別のアカウントを1つ招待しておくと、万一のときの立て直しに使えます。"),
    inviteForm,
    h("div", { class: "divider" }),
    h("h3", null, "招待の一覧"),
    invitesWrap,
    result.el,
  );

  function setActionsEnabled() {
    const on = !!op.credential && !op.busy;
    card.querySelectorAll(".op-action").forEach((b) => { b.disabled = !on; });
  }

  function setChip() {
    const left = Math.max(0, op.expiresAt - Date.now());
    const mm = Math.floor(left / 60000), ss = String(Math.floor((left % 60000) / 1000)).padStart(2, "0");
    if (op.credential) {
      stateChip.className = "chip ok";
      stateChip.textContent = `確認済み（あと ${mm}:${ss}）`;
      dock.className = "dock";
      dockText.textContent = "確認済みです。下の操作を1つ実行できます。実行すると確認は終わります。";
    } else {
      stateChip.className = "chip";
      stateChip.textContent = `未確認（あと ${mm}:${ss}）`;
      dock.className = "dock waiting";
      dockText.textContent = "まず本人確認をしてください。確認すると、下の操作を1つだけ実行できます。";
    }
  }

  async function arm() {
    const seq = ++op.armSeq;
    clearInterval(op.timer);
    op.credential = null;
    setActionsEnabled();
    let nonce;
    try {
      ({ nonce } = await send("/api/stage1/operators/nonce", { method: "POST", body: {} }));
    } catch (e) {
      result.show("本人確認の準備に失敗しました。画面を読み直してください。", false);
      return;
    }
    if (seq !== op.armSeq) return;
    op.expiresAt = Date.now() + 5 * 60 * 1000;
    try {
      await initGsi(clientId, nonce, (cred) => {
        if (seq !== op.armSeq) return;
        op.credential = cred;
        setChip(); setActionsEnabled();
      });
      if (seq !== op.armSeq) return;
      renderGsiButton(gsiHost);
    } catch { result.show("Google のサインインを読み込めませんでした。", false); return; }
    setChip();
    op.timer = setInterval(() => {
      if (Date.now() >= op.expiresAt) {
        const had = !!op.credential;
        arm();
        if (had) result.show("本人確認の期限が切れました。もう一度サインインしてください。", false);
      } else setChip();
    }, 1000);
  }

  async function runAction(request, successMsg) {
    if (!op.credential || op.busy) {
      result.show("先に本人確認をしてください。", false);
      return;
    }
    op.busy = true; setActionsEnabled();
    const cred = op.credential;
    try {
      const r = await request(cred);
      result.show(successMsg(r), true);
      toast("完了しました");
    } catch (e) {
      result.show(e.message, false);
    } finally {
      op.busy = false;
      op.credential = null;
      await refreshLists();
      arm();
    }
  }

  async function refreshLists() {
    try {
      const [ops, invs] = await Promise.all([
        send("/api/stage1/operators"),
        send("/api/stage1/operators/invitations"),
      ]);
      op.generation = ops.generation;
      genLine.textContent = `登録簿の世代：${ops.generation}（操作のたびに、古い画面との食い違いを防ぐために使われます）`;
      renderOperators(ops.operators);
      renderInvitations(invs.invitations);
      setActionsEnabled();
    } catch (e) { result.show(e.message, false); }
  }

  function renderOperators(operators) {
    if (!operators.length) { opsWrap.replaceChildren(h("div", { class: "empty" }, "運営者がいません。")); return; }
    const list = h("div", { class: "list" });
    for (const o of operators) {
      const actions = h("div", { class: "actions" });
      const btn = h("button", {
        class: "btn sm danger op-action", type: "button",
        onclick: () => confirmInline(actions, `${o.name} さんを失効させますか？`, "失効させる", () => {
          runAction(
            (cred) => send(`/api/stage1/operators/${o.id}/revoke`, {
              method: "POST", body: { credential: cred, expectedGeneration: op.generation },
            }),
            (r) => `${o.name} さんを失効させました。世代は ${r.generation} になりました。`,
          );
        }),
      }, "失効させる");
      actions.append(btn);
      list.append(h("div", { class: "row" },
        h("div", { class: "who" }, h("div", { class: "who-text" },
          h("div", { class: "who-main" }, o.name),
          h("div", { class: "who-sub" }, o.email),
        )),
        actions,
      ));
    }
    opsWrap.replaceChildren(
      list,
      operators.length <= 1
        ? h("p", { class: "small muted" }, "運営者が1人だけのときは、最後の1人を失効させることはできません。先に別の人を招待して承諾してもらってください。")
        : h("p", { class: "small muted" }, "失効させると、その人は運営者の操作ができなくなります。相手のサインインは要りません。"),
    );
  }

  function renderInvitations(invitations) {
    if (!invitations.length) { invitesWrap.replaceChildren(h("div", { class: "empty" }, "招待はまだありません。")); return; }
    const list = h("div", { class: "list" });
    for (const inv of invitations) {
      const actions = h("div", { class: "actions" });
      if (inv.status === "招待中") {
        actions.append(h("button", {
          class: "btn sm danger op-action", type: "button",
          onclick: () => confirmInline(actions, "この招待を取り消しますか？", "取り消す", () => {
            runAction(
              (cred) => send(`/api/stage1/operators/invitations/${inv.id}`, { method: "DELETE", body: { credential: cred } }),
              () => `${inv.email} への招待を取り消しました。`,
            );
          }),
        }, "取り消す"));
      }
      const chip = inv.status === "招待中" ? h("span", { class: "chip ok" }, "招待中")
        : inv.status === "承諾済み" ? h("span", { class: "chip accent" }, "承諾済み")
        : inv.status === "期限切れ" ? h("span", { class: "chip off" }, "期限切れ")
        : h("span", { class: "chip off" }, inv.status);
      list.append(h("div", { class: "row" + (inv.status !== "招待中" ? " dim" : "") },
        h("div", { class: "who" }, h("div", { class: "who-text" },
          h("div", { class: "who-main" }, inv.email),
          h("div", { class: "who-sub" }, `期限：${fmtDate(inv.expiresAt)}まで`),
        )),
        h("span", { class: "badges" }, chip),
        actions,
      ));
    }
    invitesWrap.replaceChildren(list);
  }

  refreshLists();
  arm();
  return card;
}

boot();
</script>
</body>
</html>
