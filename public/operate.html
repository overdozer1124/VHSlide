<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>学校の運用</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #f6f4ef;
        color: #1d1a16;
        line-height: 1.5;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }
      h1 {
        font-size: 1.4rem;
      }
      h2 {
        font-size: 1.15rem;
        margin: 0 0 0.4rem;
      }
      h3 {
        font-size: 1rem;
        margin: 1rem 0 0.3rem;
      }
      section,
      form {
        background: white;
        border: 1px solid #ddd6cb;
        border-radius: 8px;
        padding: 1rem;
        margin: 1rem 0;
      }
      label {
        display: block;
        margin: 0.6rem 0;
      }
      button,
      select,
      input {
        font: inherit;
      }
      button {
        margin: 0.2rem 0.4rem 0.2rem 0;
      }
      button:disabled {
        opacity: 0.45;
      }
      ol {
        margin: 0.3rem 0 0.8rem;
        padding-left: 1.4rem;
      }
      .muted {
        color: #5c564e;
      }
      .error {
        color: #8d1d1d;
      }
      .result {
        min-height: 1.4em;
        margin: 0.6rem 0 0;
      }
    </style>
  </head>
  <body data-page="stage1-operate">
    <main>
      <h1>学校の運用</h1>
      <p class="muted">
        作品の画面とは別のページです。作品のメニューからは開きません。サインインした人に許されている欄だけが表示されます。
      </p>
      <p id="status"></p>
      <div id="sign-in" hidden></div>
      <div id="app" hidden></div>
    </main>
    <script>
      const status = document.querySelector("#status");
      const signIn = document.querySelector("#sign-in");
      const app = document.querySelector("#app");
      const show = (message, error) => {
        status.textContent = message || "";
        status.className = error ? "error" : "muted";
      };
      async function send(path, method, body) {
        const response = await fetch(path, {
          method,
          headers:
            body === undefined ? {} : { "Content-Type": "application/json" },
          ...(body === undefined ? {} : { body: JSON.stringify(body) }),
        });
        const text = await response.text();
        let payload = {};
        try {
          payload = text ? JSON.parse(text) : {};
        } catch {
          payload = {};
        }
        if (!response.ok)
          throw new Error(payload.error || "操作できませんでした。");
        return payload;
      }
      function paragraph(text, className) {
        const node = document.createElement("p");
        if (className) node.className = className;
        node.textContent = text;
        return node;
      }
      function steps(lines) {
        const list = document.createElement("ol");
        for (const line of lines) {
          const item = document.createElement("li");
          item.textContent = line;
          list.append(item);
        }
        return list;
      }
      function resultSlot() {
        const node = document.createElement("p");
        node.className = "result";
        node.setAttribute("role", "status");
        return node;
      }
      function report(slot, message, error) {
        slot.textContent = message || "";
        slot.className = error ? "result error" : "result";
      }
      function field(title, control) {
        const label = document.createElement("label");
        label.append(document.createTextNode(title), control);
        return label;
      }
      function button(title, action, slot) {
        const node = document.createElement("button");
        node.type = "button";
        node.textContent = title;
        node.addEventListener("click", () =>
          action().catch((error) => report(slot, error.message, true)),
        );
        return node;
      }
      async function loadGoogle(clientId, nonce, onCredential) {
        await new Promise((resolve, reject) => {
          if (window.google) return resolve();
          const script = document.createElement("script");
          script.src = "https://accounts.google.com/gsi/client";
          script.onload = () => resolve();
          script.onerror = () =>
            reject(new Error("Googleのサインインを読み込めませんでした。"));
          document.head.append(script);
        });
        const host = document.createElement("div");
        window.google.accounts.id.initialize({
          client_id: clientId,
          nonce,
          callback: (result) => onCredential(result.credential),
        });
        window.google.accounts.id.renderButton(host, {
          theme: "outline",
          size: "large",
          locale: "ja",
          text: "signin_with",
        });
        return host;
      }
      async function draw(config) {
        const session = await send("/api/session", "GET");
        if (!session.user) {
          signIn.hidden = false;
          app.hidden = true;
          const slot = resultSlot();
          const host = await loadGoogle(
            config.clientId,
            undefined,
            (credential) =>
              send("/api/auth/google", "POST", { credential })
                .then(() => location.reload())
                .catch((error) => report(slot, error.message, true)),
          );
          signIn.replaceChildren(
            paragraph(
              "下のボタンで Google アカウントにサインインしてください。サインインすると、使える欄だけが表示されます。",
            ),
            host,
            slot,
          );
          show("");
          return;
        }
        signIn.hidden = true;
        const view = await send("/api/stage1/console", "GET");
        if (
          !view.createSchool &&
          !view.operator &&
          !view.applyTo.length &&
          !view.schools.length
        ) {
          app.hidden = true;
          show("この操作は利用できません。");
          return;
        }
        app.hidden = false;
        app.replaceChildren();
        show("");
        const accountSlot = resultSlot();
        const account = document.createElement("section");
        account.append(
          paragraph(
            `${session.user.name} として開いています。別のアカウントで操作するときは、先にサインアウトしてから入り直してください。別のウィンドウは要りません。`,
          ),
          button(
            "サインアウト",
            async () => {
              await send("/api/logout", "POST");
              location.reload();
            },
            accountSlot,
          ),
          accountSlot,
        );
        app.append(account);
        if (view.createSchool) {
          const slot = resultSlot();
          const name = document.createElement("input");
          name.maxLength = 40;
          name.required = true;
          const form = document.createElement("form");
          form.addEventListener("submit", (event) => event.preventDefault());
          form.append(
            paragraph("学校を作る", ""),
            paragraph(
              "新しい学校を1つ作ります。名前は1文字から40文字です。同じ名前の有効な学校があるときは作れません。",
            ),
            steps([
              "学校の名前を入れます。",
              "「学校を作る」を押します。",
              "作った学校が、このページの下に表示されます。",
            ]),
            field("学校の名前", name),
            button(
              "学校を作る",
              async () => {
                await send("/api/organizations", "POST", { name: name.value });
                location.reload();
              },
              slot,
            ),
            slot,
          );
          form.querySelector("p").replaceWith(
            Object.assign(document.createElement("h2"), {
              textContent: "学校を作る",
            }),
          );
          app.append(form);
        }
        for (const school of view.applyTo) {
          const managed = view.schools.find((item) => item.id === school.id);
          const section = document.createElement("section");
          const title = document.createElement("h2");
          title.textContent = school.name;
          section.append(title);
          if (!managed) {
            const slot = resultSlot();
            section.append(
              paragraph(
                "この学校の学校管理者を申請できます。申請しただけでは管理者にはなりません。スーパー管理者が「登録」か「却下」を決めます。",
              ),
              steps([
                "この学校の欄で「学校管理者を申請する」を押します。",
                "受け付けたことは、この欄に表示されます。",
              ]),
              button(
                "学校管理者を申請する",
                () =>
                  send(
                    `/api/organizations/${school.id}/school-admin-applications`,
                    "POST",
                    {},
                  ).then(() => report(slot, "申請を受け付けました。")),
                slot,
              ),
              slot,
            );
          }
          if (managed?.preregistration) {
            const slot = resultSlot();
            const email = document.createElement("input");
            email.type = "email";
            email.autocomplete = "off";
            const role = document.createElement("select");
            role.innerHTML =
              "<option value='teacher'>教師</option><option value='student'>生徒</option>";
            const heading = document.createElement("h3");
            heading.textContent = "事前登録";
            section.append(
              heading,
              paragraph(
                "まだこの学校に入っていない人を、メールアドレスで予約します。その人が次にサインインすると、選んだ役割で所属します。取り消した登録は使われません。",
              ),
              steps([
                "メールアドレスを入れます。",
                "教師か生徒を選びます。",
                "「事前登録を作る」を押します。",
                "取り消すときは、一覧の「取り消す」を押します。",
              ]),
              field("事前登録するメールアドレス", email),
              field("予定の役割", role),
              button(
                "事前登録を作る",
                async () => {
                  await send(
                    `/api/organizations/${school.id}/preregistrations`,
                    "POST",
                    { email: email.value, plannedRole: role.value },
                  );
                  location.reload();
                },
                slot,
              ),
              slot,
            );
            const rows = await send(
              `/api/organizations/${school.id}/preregistrations`,
              "GET",
            );
            if (!rows.preregistrations.length)
              section.append(paragraph("事前登録はありません。", "muted"));
            for (const row of rows.preregistrations) {
              const line = document.createElement("p");
              line.textContent = `${row.email}（${row.plannedRole === "student" ? "生徒" : "教師"}、${row.status}）`;
              if (row.status === "有効")
                line.append(
                  button(
                    "取り消す",
                    () =>
                      send(`/api/preregistrations/${row.id}`, "DELETE").then(
                        () => location.reload(),
                      ),
                    slot,
                  ),
                );
              section.append(line);
            }
          }
          if (managed?.membership) {
            const slot = resultSlot();
            const heading = document.createElement("h3");
            heading.textContent = "所属";
            section.append(
              heading,
              paragraph(
                "この学校に入っている人です。無効にすると、その人はこの学校の所属としては扱えなくなります。再有効化すると、また有効な所属に戻ります。学校管理者の解除は、スーパー管理者だけができます。",
              ),
              slot,
            );
            const members = await send(
              `/api/organizations/${school.id}/members`,
              "GET",
            );
            if (!members.members.length)
              section.append(paragraph("所属している人はいません。", "muted"));
            for (const member of members.members) {
              const line = document.createElement("p");
              line.textContent = `${member.name}（${member.email}、${member.status}${member.schoolAdmin ? "、学校管理者" : ""}）`;
              if (member.status === "有効")
                line.append(
                  button(
                    "無効化する",
                    () =>
                      send(
                        `/api/organizations/${school.id}/members/${member.id}/invalidate`,
                        "POST",
                        {},
                      ).then(() => location.reload()),
                    slot,
                  ),
                );
              if (member.status === "無効")
                line.append(
                  button(
                    "再有効化する",
                    () =>
                      send(
                        `/api/organizations/${school.id}/members/${member.id}/reactivate`,
                        "POST",
                        { role: member.role },
                      ).then(() => location.reload()),
                    slot,
                  ),
                );
              if (view.revokeSchoolAdmin && member.schoolAdmin)
                line.append(
                  button(
                    "学校管理者を解除する",
                    () =>
                      send(
                        `/api/organizations/${school.id}/school-admins/${member.id}`,
                        "DELETE",
                      ).then(() => location.reload()),
                    slot,
                  ),
                );
              section.append(line);
            }
          }
          if (view.decideApplications) {
            const slot = resultSlot();
            const heading = document.createElement("h3");
            heading.textContent = "学校管理者の申請";
            section.append(
              heading,
              paragraph(
                "申請中の人を、学校管理者として登録するか、却下します。「登録」で学校管理者にします。「却下」で申請を閉じます。",
              ),
              slot,
            );
            const applications = await send(
              `/api/organizations/${school.id}/school-admin-applications`,
              "GET",
            );
            const pending = applications.applications.filter(
              (application) => application.status === "申請中",
            );
            if (!pending.length)
              section.append(paragraph("申請中の人はいません。", "muted"));
            for (const application of pending) {
              const line = document.createElement("p");
              line.textContent = `${application.applicant.name}（${application.applicant.email}）の申請`;
              for (const decision of ["登録", "却下"])
                line.append(
                  button(
                    decision,
                    () =>
                      send(
                        `/api/school-admin-applications/${application.id}/decide`,
                        "POST",
                        { decision },
                      ).then(() => location.reload()),
                    slot,
                  ),
                );
              section.append(line);
            }
          }
          app.append(section);
        }
        if (view.operator) {
          const slot = resultSlot();
          const section = document.createElement("section");
          const title = document.createElement("h2");
          title.textContent = "運営者";
          const generation = paragraph(
            `登録簿の世代は ${view.operatorGeneration} です。相手の名前や番号は、この欄にもページのどこにも表示しません。`,
            "muted",
          );
          const held = {};
          const labels = { self: "自分", target: "相手", next: "交代先" };
          const received = document.createElement("ul");
          const addButton = button(
            "運営者を追加する",
            async () => {
              const result = await send(
                "/api/stage1/operators/add-by-sign-in",
                "POST",
                {
                  credential: held.self,
                  targetCredential: held.target,
                  expectedGeneration: view.operatorGeneration,
                },
              );
              finish(result.generation, "追加しました。");
            },
            slot,
          );
          const revokeButton = button(
            "運営者を失効する",
            async () => {
              const result = await send(
                "/api/stage1/operators/revoke-by-sign-in",
                "POST",
                {
                  credential: held.self,
                  targetCredential: held.target,
                  expectedGeneration: view.operatorGeneration,
                },
              );
              finish(result.generation, "失効しました。");
            },
            slot,
          );
          const rotateButton = button(
            "運営者を交代する",
            async () => {
              const result = await send(
                "/api/stage1/operators/rotate-by-sign-in",
                "POST",
                {
                  credential: held.self,
                  fromCredential: held.target,
                  toCredential: held.next,
                  expectedGeneration: view.operatorGeneration,
                },
              );
              finish(result.generation, "交代しました。");
            },
            slot,
          );
          function paintHeld() {
            received.replaceChildren();
            for (const key of ["self", "target", "next"]) {
              const item = document.createElement("li");
              item.textContent = `${labels[key]}: ${held[key] ? "受け取り済み" : "まだ"}`;
              received.append(item);
            }
            addButton.disabled = !(held.self && held.target);
            revokeButton.disabled = !(held.self && held.target);
            rotateButton.disabled = !(held.self && held.target && held.next);
          }
          function finish(nextGeneration, message) {
            generation.textContent = `登録簿の世代は ${nextGeneration} です。相手の名前や番号は、この欄にもページのどこにも表示しません。`;
            addButton.disabled = true;
            revokeButton.disabled = true;
            rotateButton.disabled = true;
            report(
              slot,
              `${message}世代は ${nextGeneration} です。次の操作は、ページを読み込み直してから行ってください。`,
            );
          }
          const slotSelect = document.createElement("select");
          slotSelect.innerHTML =
            "<option value='self'>自分</option><option value='target'>相手</option><option value='next'>交代先</option>";
          const issued = await send("/api/stage1/operators/nonce", "POST", {});
          const google = await loadGoogle(
            config.clientId,
            issued.nonce,
            (credential) => {
              held[slotSelect.value] = credential;
              paintHeld();
              report(
                slot,
                `${labels[slotSelect.value]}のサインインを受け取りました。まだ送信していません。`,
              );
            },
          );
          paintHeld();
          section.append(
            title,
            generation,
            paragraph(
              "運営者の追加、失効、交代をします。サインインの情報は、この欄の中だけで保持し、画面には出しません。この欄を開いてから5分以内に、必要なサインインを済ませてください。1回の操作が終わったら、ページを読み込み直してから次の操作をします。",
            ),
            paragraph("運営者を追加するとき"),
            steps([
              "「このサインインの相手」で「自分」を選び、Google でサインインします。",
              "「相手」に切り替え、追加したい人のアカウントでサインインします。",
              "「自分」と「相手」が「受け取り済み」になってから、「運営者を追加する」を押します。",
            ]),
            paragraph("運営者を失効するとき"),
            steps([
              "「自分」でサインインします。",
              "「相手」で、失効したい運営者のアカウントでサインインします。",
              "「自分」と「相手」が「受け取り済み」になってから、「運営者を失効する」を押します。",
            ]),
            paragraph("運営者を交代するとき"),
            steps([
              "「自分」でサインインします。",
              "「相手」で、今の運営者（交代元）としてサインインします。",
              "「交代先」で、新しく運営者になる人としてサインインします。",
              "3つとも「受け取り済み」になってから、「運営者を交代する」を押します。",
            ]),
            field("このサインインの相手", slotSelect),
            google,
            paragraph("サインインの受け取り", "muted"),
            received,
            addButton,
            revokeButton,
            rotateButton,
            button("ページを読み込み直す", async () => location.reload(), slot),
            slot,
          );
          app.append(section);
        }
      }
      send("/api/config", "GET")
        .then(draw)
        .catch((error) => show(error.message, true));
    </script>
  </body>
</html>
