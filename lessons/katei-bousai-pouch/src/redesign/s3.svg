ke-width="1.5" stroke-dasharray="4 3"/><line x1="890" y1="350" x2="890" y2="398" stroke="#3d4350" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="834" y1="390" x2="860" y2="390" stroke="#3d4350" stroke-width="2" marker-end="url(#d)"/><line x1="916" y1="390" x2="890" y2="390" stroke="#3d4350" stroke-width="2" marker-end="url(#d)"/><line x1="860" y1="390" x2="890" y2="390" stroke="#3d4350" stroke-width="2"/><text x="875.0" y="416" font-size="20" fill="#3d4350" text-anchor="middle" font-weight="700">0.5〜0.6cm</text><line x1="960" y1="204" x2="890" y2="300" stroke="#c2185b" stroke-width="2"/><circle cx="890" cy="300" r="4" fill="#c2185b"/><text x="966" y="210" font-size="20" fill="#c2185b" text-anchor="start" font-weight="700">端から0.5〜0.6cmを縫う</text><text x="600" y="470" font-size="20" fill="#5b6170" text-anchor="middle" font-weight="400">縫い始めと縫い終わりは返し縫い。もう一方（下側）も同じように縫う</text><line x1="20" y1="474" x2="1180" y2="474" stroke="#e3e6ec" stroke-width="2"/><path d="M30 494 L90 494" fill="none" stroke="#c2185b" stroke-width="4" stroke-dasharray="11 7" stroke-linecap="round"/><text x="100" y="501" font-size="17" fill="#5b6170" text-anchor="start" font-weight="400">縫う線（ミシン）</text><line x1="270" y1="494" x2="320" y2="494" stroke="#2b5fd9" stroke-width="3" stroke-dasharray="3 5"/><text x="330" y="501" font-size="17" fill="#5b6170" text-anchor="start" font-weight="400">印（チャコペンシル）</text><circle cx="520" cy="494" r="6" fill="#1f8a5b" stroke="#fff" stroke-width="2"/><text x="534" y="501" font-size="17" fill="#5b6170" text-anchor="start" font-weight="400">仮止め（まち針・しつけ）</text><rect x="760" y="484" width="34" height="20" fill="url(#b)" stroke="#1f2430" stroke-width="1.5"/><text x="802" y="501" font-size="17" fill="#5b6170" text-anchor="start" font-weight="400">布の表</text><rect x="880" y="484" width="34" height="20" fill="url(#u)" stroke="#1f2430" stroke-width="1.5"/><text x="922" y="501" font-size="17" fill="#5b6170" text-anchor="start" font-weight="400">布の裏</text></svg>