b6170" text-anchor="middle" font-weight="400">ポケット用布地は、斜めの織り目が見える方が表</text><text x="600" y="500" font-size="19" fill="#5b6170" text-anchor="middle" font-weight="400">応用でまちをつけるときは、ポケット用布地の長さを16cmに切ってから作る</text><line x1="20" y1="514" x2="1180" y2="514" stroke="#e3e6ec" stroke-width="2"/><path d="M30 534 L90 534" fill="none" stroke="#c2185b" stroke-width="4" stroke-dasharray="11 7" stroke-linecap="round"/><text x="100" y="541" font-size="17" fill="#5b6170" text-anchor="start" font-weight="400">縫う線（ミシン）</text><line x1="270" y1="534" x2="320" y2="534" stroke="#2b5fd9" stroke-width="3" stroke-dasharray="3 5"/><text x="330" y="541" font-size="17" fill="#5b6170" text-anchor="start" font-weight="400">印（チャコペンシル）</text><circle cx="520" cy="534" r="6" fill="#1f8a5b" stroke="#fff" stroke-width="2"/><text x="534" y="541" font-size="17" fill="#5b6170" text-anchor="start" font-weight="400">仮止め（まち針・しつけ）</text><rect x="760" y="524" width="34" height="20" fill="url(#b)" stroke="#1f2430" stroke-width="1.5"/><text x="802" y="541" font-size="17" fill="#5b6170" text-anchor="start" font-weight="400">布の表</text><rect x="880" y="524" width="34" height="20" fill="url(#u)" stroke="#1f2430" stroke-width="1.5"/><text x="922" y="541" font-size="17" fill="#5b6170" text-anchor="start" font-weight="400">布の裏</text></svg>